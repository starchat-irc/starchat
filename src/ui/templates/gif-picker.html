<div x-show="showGifPicker"
     class="gif-picker-popup"
     style="bottom: calc(100% + 4px); left: .5rem;"
     @click.outside="showGifPicker = false"
     x-init="$watch('showGifPicker', open => { if (open) openGifPickerResults(); })">

    <div class="gp-search-row">
        <i class="bi bi-search gp-search-icon"></i>
        <input type="text" class="gp-search-input" x-model="gifPicker.search"
               @input.debounce.300ms="searchGifs()"
               placeholder="{{ t('gif_search_placeholder') }}" @keydown.escape="showGifPicker = false"
               x-ref="gifSearchInput">
        <button class="gp-close-btn" x-show="gifPicker.search.length > 0" @click="gifPicker.search = ''; searchGifs()"><i class="bi bi-x"></i></button>
    </div>

    <div class="gp-grid" @scroll.debounce.150ms="if ($el.scrollTop + $el.clientHeight >= $el.scrollHeight - 50) loadMoreGifs()">
        <template x-for="gif in gifPicker.results" :key="gif.id">
            <button class="gp-gif-btn" @click="sendGif(gif)" :title="gif.title">
                <img :src="gif.preview" :alt="gif.title" loading="lazy">
            </button>
        </template>

        <div x-show="gifPicker.loading" class="gp-loading">
            <div class="spinner-border spinner-border-sm text-muted" role="status"></div>
        </div>
        <div x-show="!gifPicker.loading && gifPicker.results.length === 0" class="gp-empty"
             x-text="gifPicker.failed ? t('gif_failed') : t('gif_none')"></div>
    </div>

    <div class="gp-attribution" x-show="gifPicker.provider">
        <span>{{ t('gif_powered_by') }} <a :href="gifPicker.provider?.url" target="_blank" rel="noopener" x-text="gifPicker.provider?.name"></a></span>
    </div>
</div>

<style>
    .gif-picker-popup {
        position: absolute;
        width: 380px;
        background: #2b2d31;
        border: 1px solid rgba(255,255,255,.1);
        border-radius: 12px;
        box-shadow: 0 8px 28px rgba(0,0,0,.5);
        z-index: 1050;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    .gp-search-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 10px;
        border-bottom: 1px solid rgba(255,255,255,.06);
    }

    .gp-search-icon { color: #666; font-size: .85rem; flex-shrink: 0; }

    .gp-search-input {
        flex: 1;
        background: rgba(255,255,255,.07);
        border: 1px solid rgba(255,255,255,.08);
        border-radius: 6px;
        color: #e0e0e0;
        font-size: .85rem;
        padding: 4px 8px;
        outline: none;
        transition: border-color .15s;
    }
    .gp-search-input:focus { border-color: rgba(255,255,255,.2); }
    .gp-search-input::placeholder { color: #555; }

    .gp-close-btn {
        background: none;
        border: none;
        color: #666;
        font-size: 1rem;
        padding: 2px 4px;
        border-radius: 4px;
        cursor: pointer;
        line-height: 1;
        transition: color .15s;
    }
    .gp-close-btn:hover { color: #ccc; }

    .gp-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 6px;
        max-height: 320px;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(255,255,255,.1) transparent;
    }

    .gp-gif-btn {
        background: rgba(255,255,255,.05);
        border: none;
        border-radius: 6px;
        cursor: pointer;
        overflow: hidden;
        padding: 0;
        width: calc(50% - 2px);
        transition: transform .1s;
    }
    .gp-gif-btn:hover { transform: scale(1.03); }

    .gp-gif-btn img {
        display: block;
        width: 100%;
        height: 100px;
        object-fit: cover;
        border-radius: 6px;
    }

    .gp-loading {
        width: 100%;
        text-align: center;
        padding: .75rem 0;
    }

    .gp-empty {
        width: 100%;
        text-align: center;
        color: #555;
        font-size: .8rem;
        padding: 1.5rem 0;
    }

    .gp-attribution {
        padding: 4px 10px 6px;
        text-align: right;
        border-top: 1px solid rgba(255,255,255,.06);
        opacity: .6;
        color: #888;
        font-size: .7rem;
    }
    .gp-attribution a { color: #6e8efb; text-decoration: none; }
</style>
