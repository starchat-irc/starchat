<!-- Login overlay, shown when the user is not yet authenticated -->
<div class="login-overlay" x-show="!isAuthenticated" x-cloak>
    <div class="card bg-dark text-light" style="width: 400px;">
        <div class="card-header">{{ t('login_welcome') }}</div>
        <div class="card-body">
            <!-- Arrived through a channel / invite link: say where the user is about to go -->
            <div class="alert alert-info py-2 small" x-show="requestedChannels.length > 0" x-cloak>
                <i class="bi bi-envelope-open-heart me-1"></i>
                <span x-text="t('login_invited_to').replace(':channel', requestedChannels.join(', '))"></span>
            </div>
            <div class="mb-3">
                <label for="username" class="form-label">{{ t('login_username') }}</label>
                <input type="text" class="form-control bg-secondary text-light border-0" id="username"
                       x-model="loginUsername" :disabled="isLoading">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">{{ t('login_password') }}</label>
                <input type="password" class="form-control bg-secondary text-light border-0" id="password"
                       x-model="loginPassword" :disabled="isLoading">
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe"
                       x-model="rememberMe" :disabled="isLoading">
                <label class="form-check-label" for="rememberMe">{{ t('login_remember') }}</label>
            </div>
            <button class="btn btn-primary w-100" @click="login()" :disabled="isLoading">
                <span x-show="!isLoading">{{ t('login_submit') }}</span>
                <span x-show="isLoading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                <span x-show="isLoading"> {{ t('login_loading') }}</span>
            </button>
            <button class="btn btn-outline-secondary w-100 mt-2" @click="guestLogin()" :disabled="isLoading">
                <span x-show="!isLoading">{{ t('login_guest') }}</span>
                <span x-show="isLoading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                <span x-show="isLoading"> {{ t('login_guest_loading') }}</span>
            </button>
            <p class="small text-center mt-3 mb-0" x-show="canShareInvites()">
                {{ t('login_no_account') }}
                <a :href="`${inviteBaseUrl()}/register`" target="_blank" rel="noopener">{{ t('login_register') }}</a>
            </p>
            <p class="text-danger mt-2" x-text="loginError"></p>
        </div>
    </div>
</div>
