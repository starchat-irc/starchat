<!--
    Explore dialog: channel list of the server (LIST, every network) and the directory
    of the network (explore feature).
-->
<div x-show="exploreDialog.show"
     x-cloak
     class="quick-switcher-backdrop report-dialog-backdrop"
     @click.self="closeExplore()"
     @keydown.escape.window="exploreDialog.show && closeExplore()">
    <div class="quick-switcher report-dialog explore-dialog" role="dialog" aria-modal="true" aria-labelledby="exploreDialogTitle">
        <div class="report-dialog-header">
            <i class="bi bi-compass"></i>
            <h2 id="exploreDialogTitle" class="report-dialog-title">{{ t('explore_title') }}</h2>
            <button type="button" class="btn-close btn-close-white ms-auto" aria-label="{{ t('close') }}" @click="closeExplore()"></button>
        </div>

        <div class="report-dialog-body">
            <template x-if="hasFeature('explore')">
                <ul class="nav nav-tabs">
                    <li class="nav-item">
                        <button type="button" class="nav-link" :class="{ active: exploreDialog.tab === 'list' }"
                                @click="showExploreTab('list')">
                            {{ t('explore_tab_list') }}
                        </button>
                    </li>
                    <li class="nav-item">
                        <button type="button" class="nav-link" :class="{ active: exploreDialog.tab === 'directory' }"
                                @click="showExploreTab('directory')">
                            {{ t('explore_tab_communities') }}
                        </button>
                    </li>
                </ul>
            </template>

            <!-- Channel list of the server -->
            <template x-if="exploreDialog.tab === 'list'">
                <div class="explore-tab">
                    <div class="d-flex gap-2">
                        <input type="search" class="form-control form-control-sm report-dialog-details"
                               placeholder="{{ t('explore_search_placeholder') }}"
                               aria-label="{{ t('explore_search_placeholder') }}"
                               x-model="exploreSearch">
                        <button type="button" class="btn btn-sm btn-outline-secondary flex-shrink-0" @click="requestChannelList()" :disabled="isListing">
                            <span x-show="!isListing"><i class="bi bi-arrow-clockwise"></i> {{ t('refresh') }}</span>
                            <span x-show="isListing"><span class="spinner-border spinner-border-sm"></span> {{ t('loading') }}</span>
                        </button>
                    </div>

                    <div class="explore-count" x-show="serverChannels.length > 0">
                        <span x-text="t('explore_count', { shown: filteredServerChannels.length, total: serverChannels.length })"></span>
                        <span x-show="exploreSearch.trim()" x-text="t('explore_count_query', { query: exploreSearch })"></span>
                    </div>

                    <div class="explore-list">
                        <template x-for="channel in filteredServerChannels" :key="channel.name">
                            <div class="explore-item">
                                <div class="explore-item-text">
                                    <span class="explore-item-name" x-text="channel.name"></span>
                                    <span class="explore-item-users" x-text="t('explore_users', { count: channel.users })"></span>
                                    <p class="explore-item-topic" x-text="channel.topic || t('explore_no_topic')"></p>
                                </div>
                                <button type="button" class="btn btn-sm flex-shrink-0"
                                        :class="isChannelJoined(channel.name) ? 'btn-outline-secondary' : 'btn-success'"
                                        @click="joinChannel(channel.name)"
                                        :disabled="isChannelJoined(channel.name)">
                                    <i class="bi bi-check2" x-show="isChannelJoined(channel.name)"></i>
                                    <span x-text="isChannelJoined(channel.name) ? t('explore_joined') : t('explore_join')"></span>
                                </button>
                            </div>
                        </template>
                    </div>

                    <div class="explore-empty" x-show="!isListing && filteredServerChannels.length === 0">
                        <span x-show="exploreSearch.trim()">{{ t('explore_none_found') }}</span>
                        <span x-show="!exploreSearch.trim()">{{ t('explore_none') }}</span>
                    </div>
                </div>
            </template>

            <!-- Directory of the network -->
            <template x-if="hasFeature('explore') && exploreDialog.tab === 'directory'">
                <div class="explore-tab">
                    <div class="explore-empty" x-show="directoryLoading">
                        <span class="spinner-border spinner-border-sm"></span> {{ t('loading') }}
                    </div>
                    <div class="report-dialog-error" x-show="directoryError" role="alert">{{ t('explore_directory_error') }}</div>
                    <div class="explore-list">
                        <template x-for="community in communities" :key="community.id">
                            <div class="explore-item">
                                <div class="explore-item-text">
                                    <span class="explore-item-name" x-text="community.name"></span>
                                    <p class="explore-item-topic" x-show="community.description" x-text="community.description"></p>
                                    <p class="explore-item-topic">
                                        <strong>{{ t('channels_label') }}</strong>
                                        <span x-text="community.channel_names.join(', ')"></span>
                                    </p>
                                </div>
                                <button type="button" class="btn btn-sm flex-shrink-0"
                                        :class="isCommunityJoined(community) ? 'btn-outline-secondary' : 'btn-success'"
                                        :disabled="isCommunityJoined(community)"
                                        :title="isCommunityJoined(community) ? '' : missingCommunityChannels(community).join(', ')"
                                        @click="joinCommunity(community)">
                                    <i class="bi bi-check2" x-show="isCommunityJoined(community)"></i>
                                    <span x-text="isCommunityJoined(community) ? t('explore_joined') : t('explore_join')"></span>
                                </button>
                            </div>
                        </template>
                    </div>
                    <div class="explore-empty" x-show="!directoryLoading && !directoryError && communities.length === 0">{{ t('explore_none') }}</div>
                </div>
            </template>
        </div>
    </div>
</div>
