<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>StarChat</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <style>
        html, body { height: 100%; margin: 0; }
        body { display: flex; flex-direction: column; background: var(--chat-bg, #313338); }
        #chat { flex: 1 1 auto; min-height: 0; display: flex; }
        #chat > .chat-container { flex: 1 1 auto; }
        .page-notice {
            position: relative; z-index: 2100;
            display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;
            padding: .35rem 1rem; font-size: .8rem; color: #b5bac1; background: #1e1f22;
        }
        .page-notice[hidden] { display: none; }
        .page-notice a { color: #c9cdfb; }
        .page-notice-links { margin-left: auto; display: flex; gap: 1rem; }
        .page-error { margin: 2rem auto; max-width: 32rem; padding: 0 16px; color: #f2f3f5; font-family: system-ui, sans-serif; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body>
    <div class="page-notice" id="notice" hidden></div>
    <div id="chat"></div>
    <script type="module" src="./main.js"></script>
</body>
</html>
