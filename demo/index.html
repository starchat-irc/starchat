<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>StarChat Demo</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <meta name="description" content="Try StarChat, an open source IRCv3 web and desktop client.">
    <style>
        html, body { height: 100%; margin: 0; }
        body { display: flex; flex-direction: column; background: var(--chat-bg, #313338); }
        #chat { flex: 1 1 auto; min-height: 0; display: flex; }
        #chat > .chat-container { flex: 1 1 auto; }
        .demo-bar {
            position: relative; z-index: 2100;
            display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;
            padding: .35rem 1rem; font-size: .8rem; color: #b5bac1; background: #1e1f22;
        }
        .demo-bar a { color: #c9cdfb; }
        .demo-bar .demo-bar-links { margin-left: auto; display: flex; gap: 1rem; }
        .demo-error { margin: 2rem auto; max-width: 32rem; padding: 0 16px; color: #f2f3f5; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body>
    <div class="demo-bar">
        <span><strong>StarChat</strong> demo. ST-City is preselected, more servers under "Advanced settings". Connecting shares your IP address with the chosen server.</span>
        <span class="demo-bar-links">
            <a href="https://github.com/starchat-irc/starchat" target="_blank" rel="noopener">Source</a>
            <a href="https://st-city.net/datenschutz" target="_blank" rel="noopener">Privacy (ST-City)</a>
            <a href="https://st-city.net/impressum" target="_blank" rel="noopener">Imprint</a>
        </span>
    </div>
    <div id="chat"></div>
    <script type="module" src="./main.js"></script>
</body>
</html>
