<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="logs_title">Log Viewer</title>
    <link rel="stylesheet" href="../vendor/bootstrap.min.css">
    <script src="../vendor/i18n.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #1a1d21;
            color: #e9ecef;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            -webkit-app-region: no-drag;
        }

        /* ── Title bar ─────────────────────────────────────────────────────── */
        .title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #212529;
            border-bottom: 1px solid #2c2f33;
            padding: 6px 12px;
            flex-shrink: 0;
            -webkit-app-region: drag;
        }
        .title-bar .title-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .title-bar .app-name { font-size: 13px; color: #adb5bd; }
        .title-bar .profile-badge {
            font-size: 11px;
            color: #6c757d;
            background: #2c2f33;
            border: 1px solid #3a3d41;
            border-radius: 10px;
            padding: 1px 8px;
            -webkit-app-region: no-drag;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .title-bar .profile-badge::before { content: '● '; font-size: 8px; color: #40c057; }
        .title-bar button {
            -webkit-app-region: no-drag;
            background: none;
            border: none;
            color: #adb5bd;
            cursor: pointer;
            padding: 2px 8px;
            font-size: 14px;
            border-radius: 3px;
        }
        .title-bar button:hover { color: #fff; background: rgba(255,255,255,0.1); }

        /* ── Layout ────────────────────────────────────────────────────────── */
        .layout {
            display: flex;
            height: calc(100vh - 37px);
        }

        /* ── Sidebar ───────────────────────────────────────────────────────── */
        .sidebar {
            width: 220px;
            flex-shrink: 0;
            background: #212529;
            border-right: 1px solid #2c2f33;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar-header {
            padding: 12px 14px 10px;
            border-bottom: 1px solid #2c2f33;
            flex-shrink: 0;
        }
        .sidebar-header h6 {
            margin: 0;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: #6c757d;
        }
        .sidebar-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }
        .channel-group { margin-bottom: 2px; }
        .channel-label {
            padding: 5px 10px 5px 14px;
            font-size: 12px;
            font-weight: 600;
            color: #adb5bd;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            border-radius: 4px;
            margin: 0 4px;
            transition: background 0.1s;
        }
        .channel-label:hover { background: #2c2f33; color: #e9ecef; }
        .channel-label .collapse-icon {
            font-size: 9px;
            color: #6c757d;
            width: 10px;
            flex-shrink: 0;
            transition: transform 0.15s;
        }
        .channel-label .hash { color: #6c757d; font-size: 13px; flex-shrink: 0; }
        .channel-label .ch-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .date-list { padding: 2px 8px 4px 28px; }
        .date-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            color: #6c757d;
            font-size: 11.5px;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .date-btn:hover { background: #2c2f33; color: #e9ecef; }
        .date-btn.active { background: #0d6efd22; color: #6ea8fe; font-weight: 600; }
        .date-btn.today::after {
            content: ' ·';
            color: #40c057;
            font-weight: 700;
        }

        /* ── Log panel ─────────────────────────────────────────────────────── */
        .log-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #1a1d21;
        }
        .log-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-bottom: 1px solid #2c2f33;
            flex-shrink: 0;
            background: #212529;
        }
        .log-toolbar .title {
            flex: 1;
            font-size: 13px;
            font-weight: 600;
            color: #e9ecef;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .log-toolbar .title .date-part { color: #6c757d; font-weight: 400; margin-left: 6px; }
        .log-toolbar input {
            background: #2c2f33;
            border: 1px solid #3a3d41;
            color: #e9ecef;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 12px;
            width: 200px;
            outline: none;
        }
        .log-toolbar input:focus { border-color: #0d6efd; }
        .log-toolbar input::placeholder { color: #6c757d; }
        .log-toolbar .btn-sm {
            font-size: 12px;
            padding: 4px 10px;
            white-space: nowrap;
        }
        .log-content {
            flex: 1;
            overflow-y: auto;
            padding: 14px 18px;
            font-family: 'Cascadia Code', 'Fira Mono', 'Consolas', monospace;
            font-size: 12.5px;
            line-height: 1.6;
            color: #ced4da;
            white-space: pre-wrap;
            word-break: break-word;
            user-select: text;
        }
        .log-content .highlight {
            background: #f0b429;
            color: #000;
            border-radius: 2px;
            padding: 0 2px;
        }
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #6c757d;
            gap: 8px;
        }
        .empty-state .icon { font-size: 36px; }
        .empty-state p { font-size: 13px; margin: 0; }

        /* ── Sidebar footer ─────────────────────────────────────────────────── */
        .sidebar-footer {
            padding: 10px 10px;
            border-top: 1px solid #2c2f33;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sort-toggle {
            display: flex;
            flex: 1;
            background: #2c2f33;
            border-radius: 6px;
            padding: 2px;
            gap: 2px;
        }
        .sort-toggle button {
            flex: 1;
            background: none;
            border: none;
            color: #6c757d;
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.1s, color 0.1s;
            white-space: nowrap;
        }
        .sort-toggle button:hover { color: #adb5bd; }
        .sort-toggle button.active { background: #3a3d41; color: #e9ecef; }
        .btn-icon {
            background: none;
            border: 1px solid #3a3d41;
            color: #6c757d;
            cursor: pointer;
            padding: 4px 7px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1;
            flex-shrink: 0;
        }
        .btn-icon:hover { color: #adb5bd; border-color: #6c757d; background: #2c2f33; }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3a3d41; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #4a4d51; }

        /* ── Light theme overrides ────────────────────────────────────────── */
        .light-theme,
        .light-theme body { background: #f8f9fa; color: #212529; }
        .light-theme .title-bar { background: #e9ecef; border-bottom-color: #dee2e6; }
        .light-theme .title-bar .app-name { color: #495057; }
        .light-theme .title-bar .profile-badge { color: #495057; background: #dee2e6; border-color: #ced4da; }
        .light-theme .title-bar button { color: #495057; }
        .light-theme .title-bar button:hover { color: #212529; background: rgba(0,0,0,0.06); }
        .light-theme .sidebar { background: #e9ecef; border-right-color: #dee2e6; }
        .light-theme .sidebar-header { border-bottom-color: #dee2e6; }
        .light-theme .sidebar-header h6 { color: #6c757d; }
        .light-theme .channel-label { color: #495057; }
        .light-theme .channel-label:hover { background: #dee2e6; color: #212529; }
        .light-theme .channel-label .hash { color: #6c757d; }
        .light-theme .date-btn { color: #6c757d; }
        .light-theme .date-btn:hover { background: #dee2e6; color: #212529; }
        .light-theme .date-btn.active { background: #cfe2ff; color: #0a58ca; }
        .light-theme .log-panel { background: #f8f9fa; }
        .light-theme .log-toolbar { background: #e9ecef; border-bottom-color: #dee2e6; }
        .light-theme .log-toolbar .title { color: #212529; }
        .light-theme .log-toolbar .title .date-part { color: #6c757d; }
        .light-theme .log-toolbar input { background: #fff; border-color: #ced4da; color: #212529; }
        .light-theme .log-toolbar input::placeholder { color: #adb5bd; }
        .light-theme .log-content { color: #343a40; }
        .light-theme .empty-state { color: #adb5bd; }
        .light-theme .sidebar-footer { border-top-color: #dee2e6; }
        .light-theme .sort-toggle { background: #dee2e6; }
        .light-theme .sort-toggle button { color: #6c757d; }
        .light-theme .sort-toggle button.active { background: #fff; color: #212529; }
        .light-theme .btn-icon { color: #6c757d; border-color: #ced4da; }
        .light-theme .btn-icon:hover { color: #212529; border-color: #adb5bd; background: #dee2e6; }
        .light-theme ::-webkit-scrollbar-thumb { background: #c1c1c1; }
        .light-theme ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body x-data="logViewer()" x-init="init()">

<div class="title-bar">
    <div class="title-left">
        <span class="app-name" x-text="t('logs_title')"></span>
        <span class="profile-badge" x-show="profileName" x-text="profileName"></span>
    </div>
    <button @click="window.close()">×</button>
</div>

<div class="layout">
    <!-- Sidebar: channel/date tree -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h6 x-text="t('logs_chat_logs')">Chat Logs</h6>
        </div>
        <div class="sidebar-body">
            <template x-if="Object.keys(groupedLogs).length === 0">
                <p class="text-muted px-3 py-2" style="font-size:12px;" x-text="t('logs_no_logs')"></p>
            </template>
            <template x-for="[channel, dates] in sortedGroups" :key="channel">
                <div class="channel-group">
                    <div class="channel-label" @click="toggleChannel(channel)">
                        <span class="collapse-icon" x-text="collapsedChannels.has(channel) ? '▸' : '▾'"></span>
                        <span class="hash" x-text="channel.startsWith('#') ? '#' : '💬'"></span>
                        <span class="ch-name" x-text="channel.startsWith('#') ? channel.slice(1) : channel"></span>
                    </div>
                    <div class="date-list" x-show="!collapsedChannels.has(channel)" x-transition>
                        <template x-for="entry in sortedDates(dates)" :key="entry.file">
                            <button class="date-btn"
                                    :class="{ active: selectedFile === entry.file, today: entry.date === todayStr }"
                                    @click="selectLog(channel, entry)"
                                    x-text="entry.date">
                            </button>
                        </template>
                    </div>
                </div>
            </template>
        </div>
        <div class="sidebar-footer">
            <div class="sort-toggle">
                <button :class="{ active: sortOrder === 'desc' }" @click="sortOrder = 'desc'" x-text="t('logs_sort_newest')">Newest</button>
                <button :class="{ active: sortOrder === 'asc' }" @click="sortOrder = 'asc'" x-text="t('logs_sort_oldest')">Oldest</button>
            </div>
            <button class="btn-icon" @click="changeLogPath" :title="t('logs_change_directory')">📁</button>
        </div>
    </div>

    <!-- Main log view -->
    <div class="log-panel">
        <div class="log-toolbar">
            <span class="title" x-show="selectedFile">
                <span x-text="selectedChannel"></span>
                <span class="date-part" x-text="selectedDate"></span>
            </span>
            <span class="title" x-show="!selectedFile" x-text="t('logs_select_file')"></span>
            <input type="text"
                   :placeholder="t('logs_search')"
                   x-model="searchQuery"
                   @input.debounce.200="applySearch"
                   :disabled="!rawContent">
            <span x-show="matchCount !== null" class="text-muted" style="font-size:11px;" x-text="matchCount + ' ' + t('logs_matches')"></span>
            <button class="btn btn-sm btn-outline-secondary"
                    @click="revealFile"
                    :disabled="!selectedFile"
                    x-text="t('logs_show_in_explorer')">
            </button>
        </div>

        <div class="log-content" x-ref="logContent">
            <template x-if="!selectedFile">
                <div class="empty-state">
                    <span class="icon">📋</span>
                    <p x-text="t('logs_select_prompt')"></p>
                </div>
            </template>
            <template x-if="selectedFile && !rawContent">
                <div class="empty-state">
                    <span class="icon">⏳</span>
                    <p>Loading…</p>
                </div>
            </template>
            <template x-if="rawContent">
                <div x-html="displayContent"></div>
            </template>
        </div>
    </div>
</div>

<script src="../vendor/alpine.js" defer></script>
<script>
    function logViewer() {
        return {
            profileHash: null,
            profileName: '',
            strings: {},
            groupedLogs: {},
            collapsedChannels: new Set(),
            sortOrder: 'desc',
            todayStr: new Date().toISOString().slice(0, 10),
            selectedFile: null,
            selectedChannel: '',
            selectedDate: '',
            rawContent: '',
            searchQuery: '',
            matchCount: null,

            get sortedGroups() {
                return Object.entries(this.groupedLogs)
                    .sort((a, b) => a[0].localeCompare(b[0]));
            },

            sortedDates(dates) {
                const arr = [...dates].sort((a, b) => a.date.localeCompare(b.date));
                return this.sortOrder === 'desc' ? arr.reverse() : arr;
            },

            get displayContent() {
                if (!this.rawContent) return '';
                const escaped = this.rawContent
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
                if (!this.searchQuery.trim()) return escaped;
                const q = this.searchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const re = new RegExp(`(${q})`, 'gi');
                return escaped.replace(re, '<span class="highlight">$1</span>');
            },

            async init() {
                this.strings = await i18n.load();

                // Theme
                const theme = await window.electronAPI.getTheme();
                document.body.classList.toggle('light-theme', theme === 'light');
                window.electronAPI.on('theme-changed', (t) => {
                    document.body.classList.toggle('light-theme', t === 'light');
                });

                const params = new URLSearchParams(window.location.search);
                this.profileHash = params.get('profile') || 'default';

                // Resolve profile display name
                const profiles = await window.electronAPI.getProfiles();
                const profile = (profiles || []).find(p => p.hash === this.profileHash);
                this.profileName = profile ? (profile.name || profile.hash) : '';

                await this.fetchLogFiles();
            },

            t(key) { return this.strings[key] ?? key; },

            toggleChannel(channel) {
                const next = new Set(this.collapsedChannels);
                if (next.has(channel)) {
                    next.delete(channel);
                } else {
                    next.add(channel);
                }
                this.collapsedChannels = next;
            },

            async fetchLogFiles() {
                const files = await window.electronAPI.getLogFiles(this.profileHash);
                const grouped = {};
                for (const file of files) {
                    const match = file.match(/^(.+)-(\d{4}-\d{2}-\d{2})\.log$/);
                    if (!match) continue;
                    const [, rawChannel, date] = match;
                    const channel = rawChannel.toLowerCase();
                    if (!grouped[channel]) grouped[channel] = [];
                    grouped[channel].push({ file, date });
                }
                Object.values(grouped).forEach(arr =>
                    arr.sort((a, b) => a.date.localeCompare(b.date))
                );
                this.groupedLogs = grouped;

                // Collapse all channels except the one with the most recent entry
                const channels = Object.keys(grouped);
                if (channels.length === 0) return;

                // Find channel with the latest log date
                let latestChannel = channels[0];
                let latestDate = '';
                for (const [ch, dates] of Object.entries(grouped)) {
                    const last = dates[dates.length - 1].date;
                    if (last > latestDate) {
                        latestDate = last;
                        latestChannel = ch;
                    }
                }

                // Collapse everything except the latest channel
                const collapsed = new Set(channels.filter(ch => ch !== latestChannel));
                this.collapsedChannels = collapsed;

                // Auto-select the latest entry of the latest channel
                const latestDates = grouped[latestChannel];
                const latestEntry = latestDates[latestDates.length - 1];
                await this.selectLog(latestChannel, latestEntry);
            },

            async selectLog(channel, entry) {
                this.selectedChannel = channel;
                this.selectedDate = entry.date;
                this.selectedFile = entry.file;
                this.rawContent = '';
                this.searchQuery = '';
                this.matchCount = null;
                this.rawContent = await window.electronAPI.getLogContent(this.profileHash, entry.file);
                this.$nextTick(() => {
                    if (this.$refs.logContent) this.$refs.logContent.scrollTop = this.$refs.logContent.scrollHeight;
                });
            },

            applySearch() {
                if (!this.searchQuery.trim()) {
                    this.matchCount = null;
                    return;
                }
                const q = this.searchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const matches = this.rawContent.match(new RegExp(q, 'gi'));
                this.matchCount = matches ? matches.length : 0;
            },

            async revealFile() {
                if (!this.selectedFile) return;
                await window.electronAPI.revealLogFile(this.profileHash, this.selectedFile);
            },

            async changeLogPath() {
                const newPath = await window.electronAPI.changeLogPath(this.profileHash);
                if (newPath) await this.fetchLogFiles();
            },
        };
    }
</script>
</body>
</html>
