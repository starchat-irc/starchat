<!DOCTYPE html>
<html>
<head>
    <title data-i18n="app_title">StarChat</title>
    <script src="../vendor/i18n.js"></script>
    <style>
        body {
            background-color: transparent;
            color: #adb5bd;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-color: #212529;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        .logo {
            width: 250px;
            height: auto;
            margin-bottom: 1rem;
        }
        .spinner {
            width: 3rem;
            height: 3rem;
            border: 0.4rem solid #adb5bd;
            border-top: 0.4rem solid #0d6efd;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        @keyframes spin {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            font-size: 24px;
            margin: 0 0 10px 0;
            color: #ffffff;
        }
        #status {
            font-size: 16px;
        }
    </style>
</head>
<body>
<div class="content">
    <img id="logo" alt="" class="logo">
    <h1 id="app-name"></h1>
    <div class="spinner"></div>
    <div id="status"></div>
</div>
<script>
    const statusEl = document.getElementById('status');
    let i18nReady = false;
    let lastRawMessage = null;

    function renderStatus(message) {
        const [key, ...rest] = message.split(' ');
        const translated = i18n.t(key);
        statusEl.textContent = rest.length
            ? `${translated} ${rest.join(' ')}`
            : translated;
    }

    // Listen immediately so no events are lost
    window.electronAPI.on('update-status', (message) => {
        lastRawMessage = message;
        if (i18nReady) renderStatus(message);
        else statusEl.textContent = message; // raw fallback until translations load
    });

    window.electronAPI.getEditionInfo().then((info) => {
        document.getElementById('logo').src = info.splashImage;
        document.getElementById('app-name').textContent = info.appName;
    });

    i18n.load().then(() => {
        i18nReady = true;
        statusEl.textContent = i18n.t('splash_initializing');
        if (lastRawMessage) renderStatus(lastRawMessage);
    });
</script>
</body>
</html>
