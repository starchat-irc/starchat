<!DOCTYPE html>
<html>
<head>
    <title>Notification</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: transparent;
            overflow: hidden;
            transform: translateX(340px);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        body.visible { transform: translateX(0); }

        .toast {
            background: #1e2329;
            border: 1px solid #2d3748;
            border-left: 3px solid #0d6efd;
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            height: 70px;
            margin: 5px;
        }
        .toast:hover { background: #252b35; }

        .icon {
            width: 36px; height: 36px;
            border-radius: 8px;
            flex-shrink: 0;
            object-fit: contain;
        }
        .content { overflow: hidden; }
        .title {
            font-size: 13px; font-weight: 600;
            color: #e2e8f0;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .body {
            font-size: 12px; color: #718096;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            margin-top: 2px;
        }
    </style>
</head>
<body>
<div class="toast" id="toast">
    <img class="icon" src="../generated/icon.png" alt="">
    <div class="content">
        <div class="title" id="title"></div>
        <div class="body" id="body"></div>
    </div>
</div>
<script>
    window.electronAPI.on('notification-data', ({ title, body }) => {
        document.getElementById('title').textContent = title;
        document.getElementById('body').textContent = body;
        requestAnimationFrame(() => document.body.classList.add('visible'));
    });

    document.getElementById('toast').addEventListener('click', () => {
        window.electronAPI.notificationClicked();
    });
</script>
</body>
</html>
