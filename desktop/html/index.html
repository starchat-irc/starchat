                    const idx = this.profiles.findIndex(p => p.hash === hash);
                    // The last tab may go too: the window then shows "new connection"
                    nextActive = (this.profiles[idx + 1] || this.profiles[idx - 1])?.hash || null;
                }
                this.profiles = this.profiles.filter(p => p.hash !== hash);
                this.activeProfile = nextActive;
                if (nextActive) window.electronAPI.sendActiveProfile(nextActive);
                this.saveProfiles();
                window.electronAPI.deleteProfile(hash);
            },

            loadProfile(hash, token = null) {
                window.electronAPI.loadProfile(hash, token);
            },

            async retrySaslCredentials() {
                const username = this.saslRetryUsername.trim();
                const password = this.saslRetryPassword.trim();
                if (!username || !password) return;

                const hash = this.saslErrorProfileHash;
                this.showSaslError = false;

                const profile = this.getProfile(hash);
                if (!profile) return;

                // Update profile with new credentials
                if (profile.serverType === 'external') {
                    if (!profile.externalServer) profile.externalServer = {};
                    profile.externalServer.saslUsername = username;
                    profile.externalServer.authMethod = 'sasl_plain';
                } else {
                    profile.saslUsername = username;
                    profile.authMethod = 'sasl_plain';
                }
                this.profiles = [...this.profiles];

                // Save profile, then encrypt password
                await this.saveProfiles();
                if (profile.serverType === 'external') {
                    window.electronAPI.encryptSaslPassword(hash, password);
                } else {
                    window.electronAPI.encryptHomeSaslPassword(hash, password);
                }

                // Reload the profile (this triggers a full reconnect with new credentials + fresh API token)
                // Small delay to ensure password encryption completes
                setTimeout(() => {
                    // Remove existing iframe to force full reload
                    this.loadedProfiles.delete(hash);
                    const iframe = document.getElementById('chatFrame-' + hash);
                    if (iframe) iframe.src = 'about:blank';
                    this.loadProfile(hash);
                }, 200);
            },

            dismissSaslError() {
                this.showSaslError = false;
            },

            saveProfiles() {
                return window.electronAPI.saveProfiles(JSON.parse(JSON.stringify(this.profiles)))
                    .catch(e => {
                        console.error('save-profiles:', e);
                        throw e;
                    });
            },

            // Begin player methods

            async initPlayer() {
                // Load persisted settings
                const s = await window.electronAPI.getPlayerSettings?.() ?? {};
                this.playerVolume        = s.volume        ?? 80;
                this.playerMuted         = s.muted         ?? false;
                this.playerShuffle       = s.shuffle       ?? false;
                this.playerRepeat        = s.repeat        ?? 'none';
                this.playerRichPresence       = s.richPresence            ?? false;
                this.systemMediaRichPresence  = s.systemMediaRichPresence ?? false;
                this.playerStreamUrl     = s.streamUrl     ?? '';
                this.playerStreamUrl     = this.playerStreamUrl || (s.lastStreamUrl ?? '');
                this.playerStreamUrlInput = this.playerStreamUrl;
                this.playerPlaylist      = s.playlist      ?? [];
                this.playerLastLoadedFiles = s.lastLoadedFiles ?? [];
                this.playerCurrentIndex  = s.currentIndex  ?? -1;
                this.playerTicker = this.playerDisplayTitle;

                this._applyVolume();

                // Wire up audio element events
                const audio = this._audio();
                const streamAudio = this._streamAudio();
                if (!audio) return;

                audio.addEventListener('timeupdate',  () => {
                    this.playerCurrentTime = audio.currentTime;
                });
                audio.addEventListener('durationchange', () => {
                    this.playerDuration = isFinite(audio.duration) ? audio.duration : 0;
                });
                audio.addEventListener('ended', () => {
                    this._onTrackEnd();
                });
                // in initPlayer(): replace the existing play listener:
                audio.addEventListener('play', async () => {
                    this.playerState = 'playing';
                    this._startTicker();
                    // AudioContext nach jedem play-Event sicherstellen
                    if (this.playerAudioCtx && this.playerAudioCtx.state !== 'running') {
                        try { await this.playerAudioCtx.resume(); } catch (e) {}
                    }
                    this._startEq();
                });
                audio.addEventListener('pause', () => { this.playerState = 'paused';   this._stopTicker();  });
                audio.addEventListener('error', () => {
                    const mediaError = audio.error;
                    const message = mediaError?.message || 'Stream/Audio konnte nicht abgespielt werden';
                    this.playerStreamStatus = message;
                    this.playerState = 'stopped';
                    this._stopTicker();
                    this._stopEq();
                });

                if (streamAudio) {
                    streamAudio.addEventListener('play', async () => {
                        this.playerState = 'playing';
                        if (this.playerTab !== 'stream') this.playerTab = 'stream';
                        this.playerStreamStartedAt = Date.now();
                        this._startStreamTimeCounter();
                        this._startTicker();
                        if (this.playerAudioCtx && this.playerAudioCtx.state !== 'running') {
                            try { await this.playerAudioCtx.resume(); } catch (e) {}
                        }
                        this._startEq();
                    });
                    streamAudio.addEventListener('pause', () => {
                        if (this.playerTab === 'stream') {
                            this.playerState = 'paused';
                            this.playerStreamElapsedBeforePause = this.playerCurrentTime;
                            this._stopStreamTimeCounter();
                            this._stopTicker();
                            this._stopEq();
                        }
                    });
                    streamAudio.addEventListener('error', () => {
                        const mediaError = streamAudio.error;
                        const message = mediaError?.message || 'Stream konnte nicht abgespielt werden';
                        this.playerStreamStatus = message;
                        this.playerState = 'stopped';
                        this.playerStreamElapsedBeforePause = 0;
                        this.playerCurrentTime = 0;
                        this._stopTicker();
                        this._stopEq();
                        this._stopStreamTimeCounter();
                        this._stopStreamMetadataPolling();
                    });
                }

                this._setupAudioAnalyser(audio);
                this._setupStreamAnalyser(this._streamAudio());

                // Start system media polling if enabled
                this._startSystemMediaPolling();
            },

            _setupStreamAnalyser(streamAudio) {
                if (!streamAudio || this.playerStreamAnalyser) return;
                // AudioContext muss schon existieren (von _setupAudioAnalyser)
                if (!this.playerAudioCtx) return;
                try {
                    // crossOrigin nötig damit AudioContext den Stream anfassen darf
                    streamAudio.crossOrigin = 'anonymous';
                    const source = this.playerAudioCtx.createMediaElementSource(streamAudio);
                    this.playerStreamAnalyser = this.playerAudioCtx.createAnalyser();
                    this.playerStreamAnalyser.fftSize = 256;
                    this.playerStreamAnalyser.smoothingTimeConstant = 0.75;
                    source.connect(this.playerStreamAnalyser);
                    this.playerStreamAnalyser.connect(this.playerAudioCtx.destination);
                    this.playerStreamAnalyserData = new Uint8Array(this.playerStreamAnalyser.frequencyBinCount);
                } catch (err) {
                    console.warn('[Player] Stream analyser init failed:', err);
                    this.playerStreamAnalyser = null;
                }
            },

            // ─── Transport controls ───────────────────────────────────────────────
            playerPlay() {
                if (this.playerTab === 'stream') {
                    this.playerApplyStreamInput();
                    this._playStream();
                    return;
                }
                if (this.playerPlaylist.length === 0) return;
                if (this.playerCurrentIndex < 0) this.playerCurrentIndex = 0;
                this._loadAndPlay(this.playerCurrentIndex);
            },

            playerPause() {
                const a = this.playerTab === 'stream' ? this._streamAudio() : this._audio();
                if (!a) return;
                if (this.playerState === 'playing') {
                    a.pause();
                    this.playerState = 'paused';
                    this._stopEq();
                    this._sendMetadata(null);
                    this._pollSystemMedia();
                } else if (this.playerState === 'paused') {
                    a.play().then(() => {
                        this.playerState = 'playing';
                        this._startEq();
                        this._sendMetadata(this.playerCurrentTrack);
                    }).catch(() => {});
                }
            },

            playerStop() {
                const a = this._audio();
                const s = this._streamAudio();

                [a, s].forEach(el => {
                    if (!el) return;
                    el.pause();
                    if (el.getAttribute('src')) {
                        el.removeAttribute('src');
                    }
                });

                this.playerState       = 'stopped';
                this.playerCurrentTime = 0;
                this.playerDuration    = 0;
                this.playerStreamElapsedBeforePause = 0;
                this._stopTicker();
                this._stopEq();
                this._stopStreamTimeCounter();
                this.playerStreamStartedAt = null;
                this._stopStreamMetadataPolling();
                if (this.playerTab === 'stream') {
                    this.playerStreamStatus = 'Stream gestoppt';
                }
                this._sendMetadata(null);
                this._pollSystemMedia();
            },

            playerNext() {
                if (this.playerPlaylist.length === 0) return;
                let next;
                if (this.playerShuffle) {
                    next = Math.floor(Math.random() * this.playerPlaylist.length);
                } else {
                    next = (this.playerCurrentIndex + 1) % this.playerPlaylist.length;
                }
                this.playerCurrentIndex = next;
                this._loadAndPlay(next);
            },

            playerPrev() {
                if (this.playerPlaylist.length === 0) return;
                const prev = this.playerCurrentIndex <= 0
                    ? this.playerPlaylist.length - 1
                    : this.playerCurrentIndex - 1;
                this.playerCurrentIndex = prev;
                this._loadAndPlay(prev);
            },

            playerPlayAt(index) {
                this.playerCurrentIndex = index;
                if (this.playerTab === 'stream') {
                    this.playerTab = 'playlist';
                }
                this._loadAndPlay(index);
            },

            playerSeek(e) {
                const a = this._audio();
                if (!a || !this.playerDuration) return;
                const rect = e.currentTarget.getBoundingClientRect();
                const ratio = (e.clientX - rect.left) / rect.width;
                a.currentTime = ratio * this.playerDuration;
            },

            // ─── Volume ───────────────────────────────────────────────────────────
            playerSetVolume(e) {
                this.playerVolume = parseInt(e.target.value, 10);
                this._applyVolume();
                this._saveSettings();
            },

            playerToggleMute() {
                this.playerMuted = !this.playerMuted;
                this._applyVolume();
                this._saveSettings();
            },

            // ─── Playlist management ──────────────────────────────────────────────
            async playerAddFiles() {
                const files = await window.electronAPI.playerOpenFiles();
                if (!files || files.length === 0) return;

                for (const f of files) {
                    // Avoid duplicates
                    if (this.playerPlaylist.some(t => t.path === f.path)) continue;
                    this.playerPlaylist.push(f);
                }
                this.playerLastLoadedFiles = files.map(f => f.path).slice(-50);
                this._saveSettings();
            },

            async playerAddFolder() {
                const tracks = await window.electronAPI.playerScanFolder();
                if (!tracks || tracks.length === 0) return;
                let added = 0;
                for (const t of tracks) {
                    if (this.playerPlaylist.some(x => x.path === t.path)) continue;
                    this.playerPlaylist.push(t);
                    added++;
                }
                this.playerLastLoadedFiles = tracks.map(t => t.path).slice(-200);
                this._saveSettings();
            },

            playerRemoveTrack(index) {
                this.playerPlaylist.splice(index, 1);
                if (this.playerCurrentIndex === index) {
                    this.playerStop();
                    this.playerCurrentIndex = -1;
                } else if (this.playerCurrentIndex > index) {
                    this.playerCurrentIndex--;
                }
                this._saveSettings();
            },

            playerClearPlaylist() {
                this.playerStop();
                this.playerPlaylist      = [];
                this.playerCurrentIndex  = -1;
                this._saveSettings();
            },

            // ─── Stream ───────────────────────────────────────────────────────────
            playerApplyStreamInput() {
                this.playerStreamUrl = this._normalizeStreamUrl(this.playerStreamUrlInput);
                this._saveSettings();
            },

            // ─── Rich presence toggle ─────────────────────────────────────────────
            playerToggleRichPresence() {
                this.playerRichPresence = !this.playerRichPresence;
                if (!this.playerRichPresence) {
                    this._sendMetadata(null); // clear on disable
                }
                this._saveSettings();
                this.broadcastSettingsState();
            },

            // ─── Computed helpers (getters, safe in Alpine $data context) ────────
            get playerProgress() {
                if (!this.playerDuration) return 0;
                return (this.playerCurrentTime / this.playerDuration) * 100;
            },

            get playerCurrentTrack() {
                if (this.playerTab === 'stream' && this.playerState !== 'stopped') {
                    return {
                        title: this.playerStreamMeta?.title || this.playerStreamUrl,
                        artist: this.playerStreamMeta?.artist || 'Stream',
                        duration: 0,
                        type: 'stream',
                    };
                }
                return this.playerPlaylist[this.playerCurrentIndex] ?? null;
            },

            _streamAudio() {
                return document.getElementById('stream-player');
            },

            get playerDisplayTitle() {
                const t = this.playerCurrentTrack;
                if (!t) return 'ST-CITY CHAT  //  READY';
                if (t.type === 'stream') {
                    if (t.title && t.artist) return `${t.artist} - ${t.title}`;
                    return (t.title || this.playerStreamUrl || 'RADIO');
                }
                const parts = [];
                if (t.artist) parts.push(t.artist);
                parts.push(t.title || t.path?.split(/[\\/]/).pop() || 'Unknown');
                return parts.join(' - ');
            },

            get playerTitlebarText() {
                if (this.playerTab === 'stream' && this.playerStreamStatus) {
                    return `Mediaplayer - ${this.playerStreamStatus}`;
                }
                return 'Mediaplayer';
            },

            playerFormatTime(sec) {
                if (!sec || isNaN(sec)) return '0:00';
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            },

            // ─── Drag support ─────────────────────────────────────────────────────
            playerStartDrag(e) {
                if (e.target.closest('button, input, .wp-playlist-item')) return;
                this.playerDragging = true;
                const panel = document.getElementById('winamp-player');
                const rect  = panel.getBoundingClientRect();
                this.playerDragOffset = { x: e.clientX - rect.left, y: e.clientY - rect.top };

                const onMove = (ev) => {
                    if (!this.playerDragging) return;
                    this.playerPos = {
                        x: ev.clientX - this.playerDragOffset.x,
                        y: ev.clientY - this.playerDragOffset.y,
                    };
                    panel.style.left = this.playerPos.x + 'px';
                    panel.style.top  = this.playerPos.y + 'px';
                    panel.style.right = 'auto';
                };
                const onUp = () => {
                    this.playerDragging = false;
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                };
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            },

            // ─── Private helpers ──────────────────────────────────────────────────
            _audio() {
                return document.getElementById('media-player');
            },

            _applyVolume() {
                const vol = this.playerMuted ? 0 : this.playerVolume / 100;
                [this._audio(), this._streamAudio()].forEach(a => {
                    if (a) a.volume = vol;
                });
            },

            _loadAndPlay(index) {
                const track = this.playerPlaylist[index];
                if (!track) return;
                const a = this._audio();
                if (!a) return;

                // Stream stoppen wenn lokaler Track gestartet wird
                const streamAudio = this._streamAudio();
                if (streamAudio && !streamAudio.paused) {
                    streamAudio.pause();
                    streamAudio.removeAttribute('src');
                    this._stopStreamTimeCounter();
                    this._stopStreamMetadataPolling();
                }

                a.src = track.path.startsWith('file://') ? track.path : `file://${track.path}`;
                this._ensureAudioOutputReady().finally(() => a.play().then(() => {
                    this.playerState = 'playing';
                    this._startTicker();
                    this._startEq();
                }).catch(err => {
                    console.warn('[Player] Play error:', err);
                    this.playerState = 'stopped';
                }));
                this._sendMetadata(track);
            },

            _playStream() {
                const normalizedInput = this._normalizeStreamUrl(this.playerStreamUrlInput);
                const nextStreamUrl = normalizedInput || this.playerStreamUrl;
                if (!nextStreamUrl) {
                    this.playerStreamStatus = 'Fehler: Bitte gültige Stream-URL eingeben';
                    return;
                }
                this.playerStreamUrl = nextStreamUrl;
                this.playerStreamUrlInput = nextStreamUrl;
                this._saveSettings();

                // Lokalen Player stoppen
                const local = this._audio();
                if (local) {
                    local.pause();
                    if (local.getAttribute('src')) local.removeAttribute('src');
                }

                const a = this._streamAudio();
                if (!a) return;

                this.playerStreamStatus = 'Verbinde Stream...';
                this.playerStreamMeta = null;
                this._metadataSentPerIframe = {};  // ← Rich Presence neu senden erzwingen
                this._stopTicker();               // ← alten Ticker stoppen
                this.playerTicker = 'VERBINDE STREAM...';  // ← sofortiges Feedback

                a.pause();
                if (a.getAttribute('src')) a.removeAttribute('src');
                a.volume = this.playerMuted ? 0 : this.playerVolume / 100;
                a.src = nextStreamUrl;
                this.playerCurrentTime = 0;
                this.playerDuration = 0;
                this.playerStreamElapsedBeforePause = 0;
                this.playerStreamStartedAt = null;

                this._ensureAudioOutputReady().finally(() => a.play().then(() => {
                    this.playerState = 'playing';
                    this.playerTab = 'stream';
                    this.playerStreamStatus = 'Stream läuft';
                    this._startTicker();
                    this._startEq();
                    this._startStreamMetadataPolling();
                    this._sendMetadata({ title: nextStreamUrl, artist: 'Radio Stream', type: 'stream' });
                }).catch(err => {
                    this.playerState = 'stopped';
                    this.playerStreamStatus = `Fehler: ${err?.message || err}`;
                }));

                this.$nextTick(() => this._sendMetadata(this.playerCurrentTrack));
            },

            _onTrackEnd() {
                if (this.playerRepeat === 'one') {
                    this._loadAndPlay(this.playerCurrentIndex);
                    return;
                }
                const isLast = this.playerCurrentIndex >= this.playerPlaylist.length - 1;
                if (isLast && this.playerRepeat !== 'all') {
                    this.playerStop();
                    return;
                }
                this.playerNext();
            },

            _startTicker() {
                this._stopTicker();
                const newFull = this.playerDisplayTitle + PLAYER_TICKER_SEPARATOR;

                // Position nur resetten wenn es ein komplett neuer Text ist
                if (this.playerTickerFull !== newFull) {
                    this.playerTickerFull = newFull;
                    this.playerTickerPos = 0;
                }

                const el = document.querySelector('.wp-ticker');
                if (!el) return;

                let lastTime = null;
                let accumulated = 0;
                const MS_PER_CHAR = 120;

                const step = (timestamp) => {
                    if (!lastTime) lastTime = timestamp;
                    accumulated += timestamp - lastTime;
                    lastTime = timestamp;

                    const advance = Math.floor(accumulated / MS_PER_CHAR);
                    if (advance > 0) {
                        this.playerTickerPos = (this.playerTickerPos + advance) % this.playerTickerFull.length;
                        accumulated -= advance * MS_PER_CHAR;
                        const full = this.playerTickerFull;
                        // Straight into the DOM, no Alpine update
                        el.textContent = full.substring(this.playerTickerPos) + full.substring(0, this.playerTickerPos);
                    }

                    this.playerTickerTimer = requestAnimationFrame(step);
                };

                this.playerTickerTimer = requestAnimationFrame(step);
            },

            _stopTicker() {
                if (this.playerTickerTimer) {
                    cancelAnimationFrame(this.playerTickerTimer);
                    this.playerTickerTimer = null;
                }
                const el = document.querySelector('.wp-ticker');
                if (el) el.textContent = this.playerDisplayTitle;
            },

            _startStreamTimeCounter() {
                if (this.playerTab !== 'stream') return;
                this._stopStreamTimeCounter();
                const tick = () => {
                    if (this.playerState !== 'playing' || this.playerTab !== 'stream') return;
                    if (this.playerStreamStartedAt) {
                        this.playerCurrentTime = Math.max(
                            this.playerStreamElapsedBeforePause,
                            this.playerStreamElapsedBeforePause + ((Date.now() - this.playerStreamStartedAt) / 1000),
                        );
                    }
                };
                tick();
                this.playerStreamTimeTimer = setInterval(tick, 1000);
            },

            _stopStreamTimeCounter() {
                if (this.playerStreamTimeTimer) {
                    clearInterval(this.playerStreamTimeTimer);
                    this.playerStreamTimeTimer = null;
                }
            },

            _startEq() {
                this._stopEq();
                // Je nach Modus den richtigen Analyser wählen
                const analyser = this.playerTab === 'stream'
                    ? this.playerStreamAnalyser
                    : this.playerAnalyser;
                const data = this.playerTab === 'stream'
                    ? this.playerStreamAnalyserData
                    : this.playerAnalyserData;

                if (!analyser || !data) return;

                const step = () => {
                    if (this.playerState !== 'playing') {
                        this.playerEqHeights = this.playerEqHeights.map(() => 4);
                        return;
                    }
                    analyser.getByteFrequencyData(data);
                    const bucketSize = Math.max(1, Math.floor(data.length / 12));
                    const next = [];
                    for (let i = 0; i < 12; i++) {
                        const start = i * bucketSize;
                        const end = Math.min(data.length, start + bucketSize);
                        let sum = 0;
                        for (let j = start; j < end; j++) sum += data[j];
                        const avg = end > start ? sum / (end - start) : 0;
                        next.push(4 + Math.min(12, Math.round((avg / 255) * 12)));
                    }
                    this.playerEqHeights = next;
                    this.playerEqAnimationFrame = requestAnimationFrame(step);
                };
                this.playerEqAnimationFrame = requestAnimationFrame(step);
            },

            _stopEq() {
                if (this.playerEqAnimationFrame) {
                    cancelAnimationFrame(this.playerEqAnimationFrame);
                    this.playerEqAnimationFrame = null;
                }
                this.playerEqHeights = this.playerEqHeights.map(() => 4);
            },

            _setupAudioAnalyser(audio) {
                if (!audio || this.playerAnalyser) return;
                const AudioContextCtor = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextCtor) return;

                try {
                    this.playerAudioCtx = new AudioContextCtor();
                    const source = this.playerAudioCtx.createMediaElementSource(audio);
                    this.playerAnalyser = this.playerAudioCtx.createAnalyser();
                    this.playerAnalyser.fftSize = 256;
                    this.playerAnalyser.smoothingTimeConstant = 0.75;
                    source.connect(this.playerAnalyser);
                    this.playerAnalyser.connect(this.playerAudioCtx.destination);
                    this.playerAudioCtx.addEventListener('statechange', () => {
                        if (this.playerAudioCtx.state === 'suspended' && this.playerState === 'playing') {
                            this.playerAudioCtx.resume().catch(() => {});
                        }
                    });
                    this.playerAnalyserData = new Uint8Array(this.playerAnalyser.frequencyBinCount);
                } catch (err) {
                    console.warn('[Player] Audio analyser init failed:', err);
                }
            },

            async _ensureAudioOutputReady() {
                if (!this.playerAudioCtx) return;
                try {
                    if (this.playerAudioCtx.state === 'suspended') {
                        await this.playerAudioCtx.resume();
                    }
                } catch (err) {
                    console.warn('[Player] Audio context resume failed:', err);
                }
            },

            _startStreamMetadataPolling() {
                this._stopStreamMetadataPolling();
                const run = async () => {
                    const md = await window.electronAPI.playerFetchStreamMetadata?.(this.playerStreamUrl);
                    if (!md) return;

                    const newTitle = this.playerDisplayTitle;  // vor dem Update merken
                    this.playerStreamMeta = md;
                    const updatedTitle = this.playerDisplayTitle; // nach dem Update

                    // Ticker nur neu starten wenn sich der Text geändert hat
                    if (this.playerState === 'playing' && updatedTitle !== newTitle) {
                        // Keep the position, blend the new text in
                        this.playerTickerFull = updatedTitle + PLAYER_TICKER_SEPARATOR;
                    }
                    this._sendMetadata(this.playerCurrentTrack);
                };
                run();
                this.playerStreamMetaTimer = setInterval(run, 15000);
            },

            _stopStreamMetadataPolling() {
                if (this.playerStreamMetaTimer) {
                    clearInterval(this.playerStreamMetaTimer);
                    this.playerStreamMetaTimer = null;
                }
            },

            _normalizeStreamUrl(url) {
                const value = (url || '').trim();
                if (!value) return '';
                if (/^https?:\/\//i.test(value)) return value;
                return `https://${value}`;
            },

            /**
             * Sends IRC METADATA to broadcast now-playing status.
             * fromSystem=false → built-in player (requires playerRichPresence)
             * fromSystem=true  → OS media session (requires systemMediaRichPresence, skipped when player is playing)
             */
            _sendMetadata(track, fromSystem = false) {
                if (fromSystem) {
                    if (!this.systemMediaRichPresence) return;
                    if (this.playerState === 'playing') return; // player takes priority
                } else {
                    if (!this.playerRichPresence) return;
                }

                const value = track?.title
                    ? (track.artist ? `${track.artist} - ${track.title}` : track.title)
                    : '';
                const cmd = `METADATA * SET playing :${value}`;
                console.debug('[Player][METADATA] Dispatching command:', cmd);
                window.dispatchEvent(new CustomEvent('player:metadata', { detail: { cmd } }));
            },

            // ─── System Media (Spotify / OS Media Session) ────────────────────────
            async _pollSystemMedia() {
                if (!this.systemMediaRichPresence) return;
                if (!this.spotifyConnected) return;
                if (this.playerState === 'playing') return;
                const track = await window.electronAPI.getSystemMediaTrack?.(this.activeProfile);
                console.debug('[SystemMedia] Poll result:', track);
                const key = track ? `${track.artist}|${track.title}` : '';
                if (key !== (this._systemMediaCurrentKey ?? '')) {
                    console.debug('[SystemMedia] Track changed:', key || '(none)');
                    this._systemMediaCurrentKey = key;
                    this._sendMetadata(track || null, true);
                }
            },

            _startSystemMediaPolling() {
                this._stopSystemMediaPolling();
                if (!this.systemMediaRichPresence) {
                    console.debug('[SystemMedia] Polling not started: feature disabled');
                    return;
                }
                console.debug('[SystemMedia] Starting polling (5s interval)');
                this._pollSystemMedia();
                this._systemMediaTimer = setInterval(() => this._pollSystemMedia(), 5000);
            },

            _stopSystemMediaPolling() {
                if (this._systemMediaTimer) {
                    clearInterval(this._systemMediaTimer);
                    this._systemMediaTimer = null;
                }
            },

            playerToggleSystemMediaRichPresence() {
                this.systemMediaRichPresence = !this.systemMediaRichPresence;
                if (this.systemMediaRichPresence) {
                    this._startSystemMediaPolling();
                } else {
                    this._stopSystemMediaPolling();
                    this._systemMediaCurrentKey = '';
                    // Clear status if player is not currently broadcasting
                    if (this.playerState !== 'playing') {
                        window.dispatchEvent(new CustomEvent('player:metadata', { detail: { cmd: 'METADATA * SET playing :' } }));
                    }
                }
                this._saveSettings();
                this.broadcastSettingsState();
            },

            _saveSettings() {
                window.electronAPI.savePlayerSettings?.({
                    volume:          this.playerVolume,
                    muted:           this.playerMuted,
                    shuffle:         this.playerShuffle,
                    repeat:          this.playerRepeat,
                    richPresence:            this.playerRichPresence,
                    systemMediaRichPresence: this.systemMediaRichPresence,
                    streamUrl:       this.playerStreamUrl,
                    lastStreamUrl:   this.playerStreamUrl,
                    playlist:        JSON.parse(JSON.stringify(this.playerPlaylist)),
                    lastLoadedFiles: JSON.parse(JSON.stringify(this.playerLastLoadedFiles)),
                    currentIndex:    this.playerCurrentIndex,
                });
            },

            // End Player methods

            // ─── Settings bridge ──────────────────────────────────────────────
            // The settings window lives in the chat (one implementation for web and
            // desktop). The shell owns app-wide values (shared by all tabs) and the
            // per-connection desktop values (logging) and pushes every change to the tabs.

            /** Title bar gear: open the settings window of the active tab. */
            openChatSettings() {
                const iframe = document.getElementById('chatFrame-' + this.activeProfile);
                iframe?.contentWindow?.postMessage({ type: 'open-settings' }, '*');
            },

            /** Tabs whose chat is mounted and takes messages (chat-app-ready). */
            readyChats: new Set(),

            /** Tabs whose chat has asked for its settings: their settings window is available. */
            chatsWithSettings: new Set(),

            broadcastToChats(message) {
                document.querySelectorAll('iframe[id^="chatFrame-"]').forEach((frame) => {
                    frame.contentWindow?.postMessage(message, '*');
                });
            },

            /**
             * Connections page of the chat settings. The chat is untrusted: it only reaches the
             * main process's connections API (public profile views, validated changes, a rate
             * limited connection test): never the raw profile store.
             */
            async handleConnectionsRequest(source, data, profileHash = '') {
                const id = typeof data.id === 'string' ? data.id.slice(0, 64) : '';
                const payload = data.payload && typeof data.payload === 'object' ? data.payload : {};
                let result;
                try {
                    switch (data.action) {
                        case 'list': {
                            // The tab that asks and the edition's primary server, for titles and "current"
                            const info = await window.electronAPI.getEditionInfo();
                            result = { ...(await window.electronAPI.connectionsList()), current: profileHash, homeName: info?.networkName || '' };
                            break;
                        }
                        case 'save': result = await window.electronAPI.connectionsSave(payload); break;
                        case 'delete': result = await window.electronAPI.connectionsDelete(String(payload.hash || '')); break;
                        case 'test': result = await window.electronAPI.connectionsTest(payload); break;
                        case 'directory': result = { ok: true, ...(await window.electronAPI.getCuratedServers()) }; break;
                        case 'directory-sync': result = { ok: true, ...(await window.electronAPI.syncCuratedServers()) }; break;
                        case 'open': {
                            // Switch to the tab of that connection
                            const hash = String(payload.hash || '');
                            if (this.getProfile(hash)) this.switchProfile(hash);
                            result = { ok: true };
                            break;
                        }
                        default: result = { ok: false, reason: 'unknown_action' };
                    }
                } catch (error) {
                    console.error('[connections] request failed:', error);
                    result = { ok: false, reason: 'failed' };
                }
                source?.postMessage({ type: 'connections-response', id, result }, '*');
            },

            appSettingsState() {
                return {
                    // The connections page of the chat settings is available (see handleConnectionsRequest)
                    connectionsApi: 1,
                    theme: this.currentTheme,
                    notifyDmPopup: !!this.notificationSettings.notifyDmPopup,
                    notifyMentionPopup: !!this.notificationSettings.notifyMentionPopup,
                    notifyAnyWhenMinimized: !!this.notificationSettings.notifyAnyWhenMinimized,
                    playerRichPresence: !!this.playerRichPresence,
                    systemMediaRichPresence: !!this.systemMediaRichPresence,
                };
            },

            async sendSettingsState(profileHash, extraAppState = {}) {
                const iframe = document.getElementById('chatFrame-' + profileHash);
                if (!iframe?.contentWindow) return;
                const profile = this.getProfile(profileHash);
                const logPath = await window.electronAPI.getLogPath(profileHash) || '';
                // Spotify is linked to the account on the primary server (discovery feature "spotify")
                const spotify = profile.serverType !== 'external'
                    ? await window.electronAPI.spotifyStatus?.(profileHash)
                    : null;
                const spotifyAvailable = Boolean(spotify?.available);
                const spotifyConnected = Boolean(spotify?.connected);
                iframe.contentWindow.postMessage({
                    type: 'settings-state',
                    app: {
                        ...this.appSettingsState(),
                        errorReportCount: Number(await window.electronAPI.getErrorReportCount?.()) || 0,
                        errorReportCopied: false,
                        ...extraAppState,
                    },
                    connection: { loggingEnabled: !!profile.loggingEnabled, logPath, spotifyAvailable, spotifyConnected },
                }, '*');
            },

            /**
             * The Spotify OAuth flow runs in the system browser: poll the link status
             * until it is connected (max. 3 minutes), then update the tab.
             */
            watchSpotifyLink(profileHash) {
                clearInterval(this._spotifyWatchTimer);
                const startedAt = Date.now();
                this._spotifyWatchTimer = setInterval(async () => {
                    const result = await window.electronAPI.spotifyStatus?.(profileHash);
                    if (result?.connected || Date.now() - startedAt > 180000) {
                        clearInterval(this._spotifyWatchTimer);
                        if (profileHash === this.activeProfile) this.spotifyConnected = Boolean(result?.connected);
                        this.sendSettingsState(profileHash);
                    }
                }, 3000);
            },

            /** App-wide values changed: every tab follows. */
            broadcastSettingsState() {
                this.profiles.forEach(profile => this.sendSettingsState(profile.hash));
            },

            async applySettingFromChat(profileHash, scope, key, value) {
                if (scope === 'app') {
                    if (key === 'theme') {
                        // main broadcasts theme-changed → applied and re-sent to all tabs there
                        await window.electronAPI.saveTheme(value === 'light' ? 'light' : 'dark');
                        return;
                    }
                    if (['notifyDmPopup', 'notifyMentionPopup', 'notifyAnyWhenMinimized'].includes(key)) {
                        this.notificationSettings[key] = !!value;
                        await this.saveNotificationSettings();
                    } else if (key === 'playerRichPresence') {
                        if (this.playerRichPresence !== !!value) this.playerToggleRichPresence();
                    } else if (key === 'systemMediaRichPresence') {
                        if (this.systemMediaRichPresence !== !!value) this.playerToggleSystemMediaRichPresence();
                    } else {
                        return;
                    }
                    this.broadcastSettingsState();
                    return;
                }
                if (scope === 'connection' && key === 'loggingEnabled') {
                    this.setProfileFlag(profileHash, 'loggingEnabled', !!value);
                    this.saveProfiles();
                    this.sendSettingsState(profileHash);
                }
            },

            async runSettingsAction(profileHash, action) {
                if (action === 'change-log-path') {
                    await window.electronAPI.changeLogPath(profileHash);
                    if (profileHash === this.activeProfile) this.loadLogPath();
                    this.sendSettingsState(profileHash);
                } else if (action === 'open-log-viewer') {
                    window.electronAPI.openLogViewer(profileHash);
                } else if (action === 'open-manager') {
                    this.openConnections();
                } else if (action === 'copy-error-report') {
                    await window.electronAPI.copyErrorReport?.();
                    this.sendSettingsState(profileHash, { errorReportCopied: true });
                } else if (action === 'clear-error-report') {
                    await window.electronAPI.clearErrorReport?.();
                    this.sendSettingsState(profileHash);
                } else if (action === 'spotify-connect') {
                    if (this.getProfile(profileHash).serverType === 'external') return;
                    // Signed link from the API: no website login needed in the browser
                    let url = await window.electronAPI.spotifyAuthUrl?.(profileHash);
                    if (!url) {
                        const appUrl = await window.electronAPI.getAppUrl?.();
                        if (!appUrl) return;
                        url = `${appUrl}/spotify/connect`;
                    }
                    window.electronAPI.openExternal(url);
                    this.watchSpotifyLink(profileHash);
                } else if (action === 'spotify-disconnect') {
                    await window.electronAPI.spotifyDisconnect?.(profileHash);
                    if (profileHash === this.activeProfile) {
                        this.spotifyConnected = false;
                        // System media status needs the Spotify link
                        if (this.systemMediaRichPresence) this.playerToggleSystemMediaRichPresence();
                    }
                    this.sendSettingsState(profileHash);
                }
            },

            async refreshSpotifyStatus() {
                const profile = this.profiles.find(p => p.hash === this.activeProfile);
                if (profile?.serverType === 'external') { this.spotifyConnected = false; return; }
                const result = await window.electronAPI.spotifyStatus?.(this.activeProfile);
                this.spotifyConnected = result?.connected ?? false;
            },

            async spotifyConnect() {
                const url = await window.electronAPI.spotifyAuthUrl?.(this.activeProfile);
                if (url) window.electronAPI.openExternal(url);
            },

            async spotifyUnlink() {
                await window.electronAPI.spotifyDisconnect?.(this.activeProfile);
                this.spotifyConnected = false;
                if (this.systemMediaRichPresence) {
                    this.systemMediaRichPresence = false;
                    this._stopSystemMediaPolling();
                    this._saveSettings();
                }
            },

            openLogs() {
                window.electronAPI.openLogViewer(this.activeProfile);
            },

            /**
             * Connections live in the chat settings. When the active tab has no running chat
             * (offline, still loading), the dialog for a new connection opens instead.
             */
            openConnections() {
                const iframe = document.getElementById('chatFrame-' + this.activeProfile);
                if (iframe?.contentWindow && this.chatsWithSettings.has(this.activeProfile)) {
                    iframe.contentWindow.postMessage({ type: 'open-settings', section: 'connections' }, '*');
                    return;
                }
                this.showServerDialog = true;
            },

            updateLogging() {
                this.saveProfiles();
            },

            // Schreibt einen Boolean-Flag direkt per Array-Index in this.profiles,
            // umgeht Probleme mit Alpine x-model auf Methodenaufruf-Chains.
            setProfileFlag(hash, key, value) {
                const idx = this.profiles.findIndex(p => p.hash === hash);
                if (idx !== -1) this.profiles[idx][key] = !!value;
            },

            async saveNotificationSettings() {
                await window.electronAPI.saveNotificationSettings(
                    JSON.parse(JSON.stringify(this.notificationSettings))
                );
            },

            async loadLogPath() {
                this.logPath = await window.electronAPI.getLogPath(this.activeProfile) || '';
            },

            async changeLogPath() {
                const newPath = await window.electronAPI.changeLogPath(this.activeProfile);
                if (newPath) this.logPath = newPath;
            },

            minimize() { window.electronAPI.minimize(); },
            maximize() { window.electronAPI.maximize(); },
            close()    { this.showQuitConfirm = true; },
            confirmClose() {
                this.clearPlayingStatusThen(() => window.electronAPI.forceClose());
            },

            /** "Restart now": leaves cleanly like a normal quit, then installs the update. */
            restartForUpdate() {
                if (!this.pendingUpdate || this.updateInstalling) return;
                this.updateInstalling = true;
                this.clearPlayingStatusThen(() => window.electronAPI.installUpdate());
            },

            /** Others must not keep seeing a "now playing" status of a client that is gone. */
            clearPlayingStatusThen(next) {
                if ((this.playerRichPresence || this.systemMediaRichPresence) && this._metadataSentPerIframe && Object.keys(this._metadataSentPerIframe).length) {
                    window.dispatchEvent(new CustomEvent('player:metadata', { detail: { cmd: 'METADATA * SET playing :' } }));
                    setTimeout(next, 250);
                } else {
                    next();
                }
            },
        };
    }
</script>
