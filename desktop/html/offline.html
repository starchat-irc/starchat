<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="app_title">StarChat</title>
    <script src="../vendor/i18n.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            background: #1a1d21;
            color: #e9ecef;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 0;
            padding: 32px;
            text-align: center;
        }

        .icon {
            font-size: 52px;
            margin-bottom: 20px;
            opacity: 0.6;
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50%       { opacity: 0.9; transform: scale(1.05); }
        }

        h2 {
            margin: 0 0 10px;
            font-size: 20px;
            font-weight: 600;
            color: #f8f9fa;
        }

        p {
            margin: 0 0 28px;
            font-size: 13px;
            color: #6c757d;
            max-width: 300px;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-retry {
            background: #0d6efd;
            color: #fff;
            border: none;
            padding: 8px 22px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }

        .btn-retry:hover  { background: #0b5ed7; }
        .btn-retry:active { transform: scale(0.97); }

        .btn-retry.loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .spinner {
            display: none;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }

        .btn-retry.loading .spinner { display: inline-block; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status {
            font-size: 11px;
            color: #6c757d;
            margin-top: 16px;
            min-height: 16px;
            transition: color 0.3s;
        }
        .status.error { color: #dc3545; }

        /* Subtle grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="page">
    <div class="icon">🔌</div>
    <h2 id="offline-title"></h2>
    <p id="offline-body"></p>

    <div class="actions">
        <button class="btn-retry" id="retryBtn" onclick="retry()">
            <span class="spinner" id="spinner"></span>
            <span id="offline-retry-label"></span>
        </button>
    </div>

    <div class="status" id="status"></div>
</div>

<script>
    let retrying = false;

    async function init() {
        await i18n.load();
        document.getElementById('offline-title').textContent = i18n.t('offline_title');
        document.getElementById('offline-body').textContent  = i18n.t('offline_body');
        document.getElementById('offline-retry-label').textContent = i18n.t('offline_retry');
    }

    function retry() {
        if (retrying) return;
        retrying = true;

        const btn = document.getElementById('retryBtn');
        const status = document.getElementById('status');

        btn.classList.add('loading');
        status.textContent = i18n.t('offline_connecting');
        status.className = 'status';

        setTimeout(() => {
            window.parent.postMessage({ type: 'retry-connection' }, '*');

            setTimeout(() => {
                retrying = false;
                btn.classList.remove('loading');
                status.textContent = i18n.t('offline_timeout');
                status.className = 'status error';
            }, 8000);
        }, 400);
    }

    init();
</script>
</body>
</html>
