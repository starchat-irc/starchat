name: Release

# Packs the hostable web page (web/, see docs/hosting.md) and attaches it to a GitHub release.
#
#  - Push to main: the pre-release "latest-dev" is moved to that commit. Its old archives
#    are deleted first, so it always holds exactly one build.
#  - Tag v*: a release of its own with starchat-web-<tag>.zip and .tar.gz.
#
# The archives contain one folder, starchat-web/, with index.html, config.json and the rest.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.web.config.js'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

# Builds of main replace each other; a tag is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:web

      - name: Pack
        id: pack
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            name="starchat-web-$GITHUB_REF_NAME"
          else
            name="starchat-web-dev"
          fi
          printf '{\n    "version": "%s",\n    "commit": "%s",\n    "built": "%s"\n}\n' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist-web/build.json
          rm -rf starchat-web && cp -r dist-web starchat-web
          tar -czf "$name.tar.gz" starchat-web
          zip -qr "$name.zip" starchat-web
          echo "files=$name.zip $name.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Update latest-dev
        if: github.ref == 'refs/heads/main'
        run: |
          notes="Development build of main at ${GITHUB_SHA::7}, replaced on every push. Not for production use. See docs/hosting.md."
          git tag -f latest-dev "$GITHUB_SHA"
          git push -f origin refs/tags/latest-dev
          if gh release view latest-dev > /dev/null 2>&1; then
            gh release view latest-dev --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset latest-dev "$asset" --yes
            done
            gh release edit latest-dev --prerelease --title "Development build" --notes "$notes"
          else
            gh release create latest-dev --prerelease --title "Development build" --notes "$notes"
          fi
          gh release upload latest-dev ${{ steps.pack.outputs.files }} --clobber

      - name: Release
        if: github.ref_type == 'tag'
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ${{ steps.pack.outputs.files }} --clobber
          else
            gh release create "$GITHUB_REF_NAME" ${{ steps.pack.outputs.files }} --title "$GITHUB_REF_NAME" --generate-notes --latest
          fi
