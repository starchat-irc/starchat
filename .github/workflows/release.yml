name: Release

# Packs the hostable web page (web/, see docs/hosting.md) and attaches it to a GitHub release.
#
#  - Push to main: the pre-release "latest-dev" is moved to that commit. Its old archives
#    are deleted first, so it always holds exactly one build.
#  - Tag v*: a release of its own with starchat-web-<tag>.zip and .tar.gz. Its text is the
#    section of the version in CHANGELOG.md (.github/scripts/changelog-section.sh). The job "npm"
#    also stages the package on npm (latest, or next for versions like 1.2.0-beta.1).
#    A maintainer approves it on npmjs.com with 2FA, only then is it published. It runs
#    in the environment "npm" and signs in with trusted publishing (OIDC), no token.
#
# The archives contain one folder, starchat-web/, with index.html, config.json and the rest.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.web.config.js'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

# Builds of main replace each other; a tag is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Changelog section for the tag
        if: github.ref_type == 'tag'
        run: sh .github/scripts/changelog-section.sh "$GITHUB_REF_NAME" > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:web

      - name: Pack
        id: pack
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            name="starchat-web-$GITHUB_REF_NAME"
          else
            name="starchat-web-dev"
          fi
          printf '{\n    "version": "%s",\n    "commit": "%s",\n    "built": "%s"\n}\n' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist-web/build.json
          rm -rf starchat-web && cp -r dist-web starchat-web
          tar -czf "$name.tar.gz" starchat-web
          zip -qr "$name.zip" starchat-web
          echo "files=$name.zip $name.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Update latest-dev
        if: github.ref == 'refs/heads/main'
        run: |
          notes="Development build of main at ${GITHUB_SHA::7}, replaced on every push. Not for production use. See docs/hosting.md."
          git tag -f latest-dev "$GITHUB_SHA"
          git push -f origin refs/tags/latest-dev
          if gh release view latest-dev > /dev/null 2>&1; then
            # Only the web package: the desktop installers belong to desktop.yml
            gh release view latest-dev --json assets --jq '.assets[].name' | grep '^starchat-web-' | while read -r asset; do
              gh release delete-asset latest-dev "$asset" --yes
            done
            gh release edit latest-dev --prerelease --title "Development build" --notes "$notes"
          else
            # desktop.yml may create it at the same time
            gh release create latest-dev --prerelease --title "Development build" --notes "$notes" \
              || gh release view latest-dev > /dev/null
          fi
          gh release upload latest-dev ${{ steps.pack.outputs.files }} --clobber

      - name: Release
        if: github.ref_type == 'tag'
        run: |
          # desktop.yml may create the release at the same time
          sh .github/scripts/changelog-section.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --latest \
            || gh release view "$GITHUB_REF_NAME" > /dev/null
          gh release upload "$GITHUB_REF_NAME" ${{ steps.pack.outputs.files }} --clobber

  npm:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Changelog section for the tag
        if: github.ref_type == 'tag'
        run: sh .github/scripts/changelog-section.sh "$GITHUB_REF_NAME" > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Staged publishing needs npm 11.15 or later
      - run: npm install -g npm@^11.15.0
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Stage on npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version=$(node -p "require('./package.json').version")
          if [ "$package_version" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $package_version in package.json"
            exit 1
          fi
          case "$version" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          npm stage publish --tag "$dist_tag"
