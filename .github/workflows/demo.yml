name: Demo

# Builds the web demo (the hostable page from web/ with demo/config.json) and the docs
# and publishes them to getstarchat.net/demo/ and
# getstarchat.net/docs/ (repository starchat-irc/getstarchat.net, served with GitHub
# Pages). The Bootstrap stylesheet of the site comes from our dependency, so the site
# and the chat use the same version.
#
# Needs the secret SITE_DEPLOY_KEY: the private half of an SSH deploy key that has
# write access to starchat-irc/getstarchat.net and nothing else.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'demo/**'
      - 'docs/**'
      - 'scripts/build-docs.mjs'
      - 'scripts/render-openapi.mjs'
      - 'scripts/validate-openapi.mjs'
      - 'servers/**'
      - 'package.json'
      - 'package-lock.json'
      - 'web/**'
      - 'vite.web.config.js'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time; a newer push replaces a waiting one.
concurrency:
  group: demo
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - run: cp demo/config.json dist-web/config.json
      - run: npm run build:docs

      - name: Publish to getstarchat.net
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SITE_DEPLOY_KEY" > ~/.ssh/site_deploy_key
          chmod 600 ~/.ssh/site_deploy_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/site_deploy_key -o IdentitiesOnly=yes"

          git clone --depth 1 git@github.com:starchat-irc/getstarchat.net.git site
          rm -rf site/demo site/docs
          cp -r dist-web site/demo
          cp -r dist-docs site/docs
          mkdir -p site/vendor
          cp node_modules/bootstrap/dist/css/bootstrap.min.css site/vendor/

          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo docs vendor
          if git diff --cached --quiet; then
            echo "Demo and docs unchanged"
            exit 0
          fi
          git commit -m "Update demo and docs from starchat@${GITHUB_SHA::7}"
          git push
