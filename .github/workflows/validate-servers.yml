name: Validate server list

on:
  push:
    paths:
      - 'servers/**'
      - 'scripts/validate-servers.mjs'
  pull_request:
    paths:
      - 'servers/**'
      - 'scripts/validate-servers.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:servers
