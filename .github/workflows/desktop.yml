name: Desktop

# Builds the desktop app (desktop/, see docs/desktop.md) for Windows, Linux and macOS and
# attaches the installers to a GitHub release, next to the web package of release.yml.
#
#  - Push to main: the installers on the pre-release "latest-dev" are replaced.
#  - Tag v*: installers and the update files (latest*.yml, *.blockmap) go to the release
#    of the tag. The app looks for updates there (edition.json → updates).
#
# Builds are not signed yet (see the README). A fork builds its own edition by setting the
# repository variable STARCHAT_EDITION to its edition folder, e.g. desktop/editions/example.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    env:
      STARCHAT_EDITION: ${{ vars.STARCHAT_EDITION }}
      # No signing certificate yet: do not look for one in the keychain
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop

      - name: Version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "STARCHAT_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "STARCHAT_VERSION=0.0.0-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi

      - run: node scripts/build.mjs dist ${{ matrix.target }} --publish never
        working-directory: desktop

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      # The update files are only needed in real releases
      - name: Update latest-dev
        if: github.ref == 'refs/heads/main'
        run: |
          rm -f assets/*.blockmap assets/latest*.yml
          notes="Development build of main at ${GITHUB_SHA::7}, replaced on every push. Not for production use."
          git tag -f latest-dev "$GITHUB_SHA"
          git push -f origin refs/tags/latest-dev
          if gh release view latest-dev > /dev/null 2>&1; then
            # Only the desktop files: web package and APK belong to release.yml and android.yml
            gh release view latest-dev --json assets --jq '.assets[].name' | grep -vE '^starchat-(web|android)-' | while read -r asset; do
              gh release delete-asset latest-dev "$asset" --yes
            done
          else
            gh release create latest-dev --prerelease --title "Development build" --notes "$notes" \
              || gh release view latest-dev > /dev/null
          fi
          gh release upload latest-dev assets/* --clobber

      - name: Release
        if: github.ref_type == 'tag'
        run: |
          # release.yml may create the release at the same time
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --latest \
            || gh release view "$GITHUB_REF_NAME" > /dev/null
          gh release upload "$GITHUB_REF_NAME" assets/* --clobber
